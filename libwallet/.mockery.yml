# Generates a mock of every interface in the packages below, next to it under mock/. They are
# libwallet's boundaries to the apps and to external services, which tests replace most often.
# Regenerate with 'muun libwallet regenmocks'; 'muun lint libwallet' fails if they drift.
all: true
template: testify
formatter: goimports
dir: "{{.InterfaceDir}}/mock"
pkgname: mock
structname: "Mock{{.InterfaceName | firstUpper}}"
filename: "mock_{{.InterfaceName | snakecase}}.go"
force-file-write: true
log-level: warn
# To mock the interfaces of another package, add it below. To skip an interface in a listed
# package, put '//mockery:generate: false' in its doc comment, with the reason.
packages:
  github.com/muun/libwallet/app_provided_data: {}
  github.com/muun/libwallet/app_provided_data/adapted: {}
  github.com/muun/libwallet/base/data/electrum/v2: {}
  github.com/muun/libwallet/base/data/houston: {}
  github.com/muun/libwallet/base/data/securekv: {}
  github.com/muun/libwallet/subsystems/background_actions/internal/data/repository: {}
